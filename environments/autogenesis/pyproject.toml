[project]
name = "autogenesis"
version = "0.1.0"
description = "Train models to build RL environments that discriminate between models and resist reward hacking."
tags = ["meta", "environment-design", "reward-hacking", "multi-agent", "train", "eval"]
license = "Apache-2.0"
requires-python = ">=3.11,<3.15"
dependencies = ["verifiers>=0.4.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autogenesis"]

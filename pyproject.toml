[project]
name = "autogenesis-workspace"
version = "0.1.0"
description = "Workspace for the Autogenesis RL environment and its tests."
requires-python = ">=3.11,<3.15"
dependencies = ["autogenesis"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.8"]

[tool.uv.workspace]
members = ["environments/autogenesis"]

[tool.uv.sources]
autogenesis = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: runs a full episode through vf-run against a local fake model server"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["SIM105"]

[tool.ruff.lint.isort]
known-first-party = ["autogenesis", "fixtures"]
